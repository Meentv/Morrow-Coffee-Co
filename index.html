<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Defaults. Per-route <Seo /> overrides title/description/OG at runtime. -->
    <title>Morrow Coffee Co. — Good coffee, made human</title>
    <meta
      name="description"
      content="Morrow Coffee Co. — warm coffee, thoughtful food, and a kitchen worth gathering around."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2a1c15" />

    <!-- Fonts are self-hosted via @fontsource-variable (see src/main.tsx) —
         no third-party font request, no FOUT from a blocked CDN. -->

    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif">
        Morrow Coffee Co. needs JavaScript to run the menu, cart, and booking forms. Please enable
        it, or call us on +1 234 567 890.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
