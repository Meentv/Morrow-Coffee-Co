<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Defaults. Per-route <Seo /> overrides title/description/OG at runtime. -->
    <title>Morrow Coffee Co. — Good coffee, made human</title>
    <meta
      name="description"
      content="Morrow Coffee Co. — warm coffee, thoughtful food, and a kitchen worth gathering around."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2a1c15" />

    <!-- Static social defaults so crawlers that never execute JavaScript still
         get a real preview card. <Seo /> replaces these per route at runtime.
         og:url/canonical are omitted here on purpose: without a real domain
         (VITE_SITE_URL) inventing one would be worse than leaving it out. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Morrow Coffee Co." />
    <meta property="og:title" content="Morrow Coffee Co. — Good coffee, made human" />
    <meta
      property="og:description"
      content="Warm coffee, thoughtful food, and a kitchen worth gathering around."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The sunlit Morrow Coffee Co. room with its brass pendant lights and pastry counter"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted via @fontsource-variable (see src/main.tsx) —
         no third-party font request, no FOUT from a blocked CDN. -->

    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif">
        Morrow Coffee Co. needs JavaScript to run the menu, cart, and booking forms. Please enable
        it, or call us on +1 234 567 890.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
